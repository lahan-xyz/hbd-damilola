<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Happy Birthday, Damilola 💛</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎂</text></svg>" />

  <!-- Fontsource: Playfair Display (elegant display serif) + Manrope (clean UI sans) + Great Vibes (script accent) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/playfair-display/index.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/playfair-display/600.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/playfair-display/700.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/playfair-display/800.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/manrope/index.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/manrope/600.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/manrope/700.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/manrope/800.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/great-vibes/index.css" />

  <script type="importmap">
    { "imports": { "valen": "https://esm.sh/@lahan-xyz/valen" } }
  </script>
  <link rel="modulepreload" href="https://esm.sh/@lahan-xyz/valen" />
</head>
<body>
  <div id="app"></div>

  <script type="module">
    import { Component, render } from 'valen';

    /* ============================================================
       🎵 MUSIC — your own audio file (no synth).
       Drop your song next to this page (or point SONG_SRC anywhere)
       and it will loop from the moment the surprise is revealed.
       ============================================================ */
    const SONG_SRC = './hbd_song.mp3';   // ← replace with your audio file path

    const birthdaySong = new Audio(SONG_SRC);
    birthdaySong.loop = true;
    birthdaySong.volume = 0.9;
    birthdaySong.preload = 'auto';

    let songOn = false;

    function playSong() {
      songOn = true;
      // guarded: if the file is missing/blocked, the page keeps working
      birthdaySong.play().catch(() => {});
    }
    function stopSong() {
      songOn = false;
      birthdaySong.pause();
    }

    /* ============================================================
       CONFETTI — canvas rain + click bursts (black & gold palette)
       ============================================================ */
    const FX = { rain() {}, burst() {} };

    function Confetti() {
      return {
        template: `<canvas id="confetti-canvas"></canvas>`,
        run() {
          const canvas = document.getElementById('confetti-canvas');
          const ctx = canvas.getContext('2d');
          const COLORS = ['#FFD700', '#FFCC00', '#FFE44D', '#FFF3B0', '#B8860B', '#FFFFFF'];
          let W, H, pieces = [];

          const resize = () => { W = canvas.width = innerWidth; H = canvas.height = innerHeight; };
          resize();
          addEventListener('resize', resize);

          const spawnRain = (n) => {
            for (let i = 0; i < n; i++) pieces.push({
              shape: Math.random() > 0.35 ? 'rect' : 'circle',
              x: Math.random() * W, y: -20,
              vx: (Math.random() - 0.5) * 1.2, vy: Math.random() * 3 + 2.5,
              w: Math.random() * 8 + 4, h: Math.random() * 5 + 3,
              rot: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.2,
              color: COLORS[(Math.random() * COLORS.length) | 0]
            });
          };

          FX.rain = (seconds = 6) => {
            const until = Date.now() + seconds * 1000;
            const tick = () => {
              if (Date.now() > until) return;
              spawnRain(14);
              setTimeout(tick, 110);
            };
            tick();
          };

          FX.burst = (x, y, n = 55) => {
            for (let i = 0; i < n; i++) {
              const a = Math.random() * Math.PI * 2, s = Math.random() * 9 + 3;
              pieces.push({
                shape: Math.random() > 0.4 ? 'rect' : 'circle',
                x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 2,
                w: Math.random() * 7 + 3, h: Math.random() * 5 + 3,
                rot: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.3,
                color: COLORS[(Math.random() * COLORS.length) | 0]
              });
            }
          };

          const frame = () => {
            ctx.clearRect(0, 0, W, H);
            pieces = pieces.filter(p => p.y < H + 60 && p.y > -80);
            if (pieces.length > 500) pieces.splice(0, pieces.length - 500);
            for (const p of pieces) {
              p.vy += 0.07; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
              ctx.save();
              ctx.translate(p.x, p.y);
              ctx.rotate(p.rot);
              ctx.fillStyle = p.color;
              if (p.shape === 'rect') ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
              else { ctx.beginPath(); ctx.arc(0, 0, p.w / 2, 0, Math.PI * 2); ctx.fill(); }
              ctx.restore();
            }
            requestAnimationFrame(frame);
          };
          frame();
        },
        stylesheet: {
          '#confetti-canvas': `
            position: fixed; inset: 0;
            pointer-events: none;
            z-index: 40;
          `
        }
      };
    }
    Component(Confetti);

    /* ============================================================
       INTRO — typewriter with a "ghost" sizing layer so the caret
       is perfectly locked to the text (no re-centering jitter).
       ============================================================ */
    const INTRO_LINES = [
      'Hey Damilola... 💛',
      'Something magical is in the air today ✨',
      'The stars aligned, the cake is baked...',
      'Are you ready for your surprise?'
    ];

    function Intro() {
      return {
        state: { line: '', ghost: '', lineClass: 'below', cursorClass: 'blink' },
        template: `
          <div class="intro">
            <p class="intro-line [ lineClass ]"><span class="ghost" aria-hidden="true">[ ghost ]</span><span class="typed">[ line ]<span class="cursor [ cursorClass ]"></span></span></p>
          </div>
        `,
        created(state) {
          const TYPE = 55, HOLD = 1000, SLIDE = 520;
          let li = 0;

          const runLine = () => {
            if (li >= INTRO_LINES.length) {
              setTimeout(() => document.dispatchEvent(new Event('valen:intro-done')), 250);
              return;
            }
            const text = INTRO_LINES[li];

            // 1. while invisible: set final width (ghost), park below
            state.line = '';
            state.ghost = text;
            state.lineClass = 'below';
            state.cursorClass = 'blink';

            setTimeout(() => {
              // 2. slide up into center
              state.lineClass = '';

              setTimeout(() => {
                // 3. type — caret solid, text never shifts backward
                state.cursorClass = '';
                let ci = 0;
                const type = () => {
                  ci++;
                  state.line = text.slice(0, ci);
                  if (ci < text.length) {
                    setTimeout(type, TYPE);
                  } else {
                    li++;
                    // 4. hold (caret blinks), then slide up & out
                    state.cursorClass = 'blink';
                    setTimeout(() => {
                      state.lineClass = 'out';
                      setTimeout(runLine, SLIDE);
                    }, HOLD);
                  }
                };
                type();
              }, SLIDE);
            }, 60);
          };

          setTimeout(runLine, 700);
        },
        stylesheet: {
          '.intro': `
            width: 100%;
            text-align: center;
            padding-inline: 6%;
          `,
          '.intro-line': `
            position: relative;
            display: inline-block;
            max-width: 100%;
            margin: 0;
            line-height: 1.4;
            text-align: left;
            font-family: 'Playfair Display', Georgia, serif;
            font-size: clamp(1.45rem, 4.6vw, 2.4rem);
            font-weight: 600;
            color: #FFCC00;
            text-shadow: 0 0 24px rgba(255, 204, 0, .35);
            transition: transform .5s cubic-bezier(.22,.9,.3,1.05), opacity .5s ease;
            will-change: transform, opacity;
          `,
          '.intro-line.out': `
            transform: translateY(-48px) scale(.82);
            opacity: 0;
          `,
          '.intro-line.below': `
            transform: translateY(48px) scale(.9);
            opacity: 0;
            transition: none;
          `,

          /* invisible sizer — locks width & wrap points before typing */
          '.ghost': `
            visibility: hidden;
            padding-right: 5px; /* exact caret footprint → identical wrapping */
          `,

          /* typed overlay — same box, same flow, left-aligned */
          '.typed': `
            position: absolute;
            inset: 0;
            text-align: left;
          `,

          /* caret — hugs the last character, never detaches */
          '.cursor': `
            display: inline-block;
            width: 3px;
            height: 1.05em;
            margin-left: 2px;
            vertical-align: -0.18em;
            border-radius: 2px;
            background: #FFD700;
            box-shadow: 0 0 10px rgba(255, 215, 0, .6);
          `,
          '.blink': `
            animation: blink .6s step-end infinite;
          `,
          '@keyframes blink': `50% { opacity: 0; }`
        }
      };
    }
    Component(Intro);

    /* ============================================================
       BALLOONS — floating emoji rising endlessly
       ============================================================ */
    const BALLOONS = [
      { e: '🎈', l: 8,  d: 10,   del: 0,   s: 42 },
      { e: '💛', l: 22, d: 13,   del: 1.4, s: 34 },
      { e: '🎉', l: 36, d: 11,   del: 2.6, s: 38 },
      { e: '🎈', l: 52, d: 14,   del: .6,  s: 46 },
      { e: '✨', l: 66, d: 12,   del: 3.2, s: 30 },
      { e: '🎈', l: 79, d: 10.5, del: 1.9, s: 40 },
      { e: '🌟', l: 92, d: 13.5, del: 3.8, s: 34 }
    ];

    function Balloons() {
      return {
        template() {
          return BALLOONS.map(b =>
            `<span class="balloon" style="left:${b.l}%; font-size:${b.s}px; animation-duration:${b.d}s; animation-delay:${b.del}s;">${b.e}</span>`
          ).join('');
        },
        stylesheet: {
          '.balloon': `
            position: fixed;
            bottom: -90px;
            z-index: 10;
            animation-name: rise;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
            pointer-events: none;
            will-change: transform;
          `,
          '@keyframes rise': `
            0%   { transform: translateY(0) rotate(-6deg); opacity: 0; }
            8%   { opacity: 1; }
            50%  { transform: translateY(-60vh) rotate(6deg); }
            92%  { opacity: 1; }
            100% { transform: translateY(-125vh) rotate(-6deg); opacity: 0; }
          `
        }
      };
    }
    Component(Balloons);

    /* ============================================================
       MAIN — phase machine: intro → ask → celebrate
       ============================================================ */
    function Main() {
      let dodges = 0, fireworkTimer = null;

      return {
        state: {
          phase: 'intro',          // 'intro' | 'ask' | 'celebrate'
          askIn: '',
          taunt: '',
          musicIcon: '🔊'
        },

        template() {
          return `
            <Confetti />

            <button class="music-btn" v:show="[ phase === 'celebrate' ]"
                    @click="this.toggleMusic()">[ musicIcon ]</button>

            <div class="stage" v:show="[ phase === 'intro' ]">
              <div class="wrap"><Intro /></div>
            </div>

            <div class="stage slider [askIn]" v:show="[ phase === 'ask' ]">
              <div class="wrap">
                <p class="taunt" v:show="[ taunt ]">[ taunt ]</p>
                <h2 class="ask-title">Do you want to see your<br>surprise, Damilola?</h2>
                <div class="btns">
                  <button class="btn gold" @click="this.yes()">Yes, show me! 💛</button>
                  <button id="no-btn" class="btn ghost"
                          @mouseover="this.dodge()"
                          @click="this.no()">No 🙃</button>
                </div>
              </div>
            </div>

            <div class="stage celebrate" v:show="[ phase === 'celebrate' ]">
              <div class="wrap">
                <Balloons />
                <p class="pre">✨ &nbsp;the world got brighter on this day&nbsp; ✨</p>
                <h1 class="hbd">HAPPY BIRTHDAY</h1>
                <h2 class="name">Damilola</h2>
                <div class="cake">🎂</div>
                <p class="wish-line w1">May your year sparkle brighter than gold ✨</p>
                <p class="wish-line w2">Cake, laughter &amp; everything you wish for 🎈</p>
                <p class="wish-line w3">You are loved, today &amp; always 💛</p>
                <p class="hint">psst — tap anywhere for fireworks 🎆</p>
                <div class="btns">
                  <button class="btn gold" @click="this.more()">More Confetti 🎉</button>
                  <button class="btn ghost" @click="this.replay()">Replay ↻</button>
                </div>
              </div>
            </div>
          `;
        },

        created(state) {
          document.addEventListener('valen:intro-done', () => {
            state.phase = 'ask';
            // next tick so the freshly-shown stage transitions in (slides up)
            setTimeout(() => { state.askIn = 'in'; }, 60);
          });

          document.addEventListener('click', (e) => {
            if (state.phase === 'celebrate') FX.burst(e.clientX, e.clientY, 35);
          });

          this.yes = () => this.celebrate(state);

          this.no = () => {
            if (state.taunt) return;
            state.taunt = 'Nice try 😌 — the surprise is happening anyway!';
            setTimeout(() => this.celebrate(state), 1200);
          };

          this.dodge = () => {
            if (state.phase !== 'ask' || state.taunt) return;
            dodges++;
            if (dodges > 5) { this.no(); return; }
            const btn = document.getElementById('no-btn');
            if (!btn) return;
            const padX = Math.min(90, innerWidth * 0.18);
            const padY = Math.min(90, innerHeight * 0.15);
            const x = padX + Math.random() * Math.max(1, innerWidth - padX * 2 - 140);
            const y = padY + Math.random() * Math.max(1, innerHeight - padY * 2 - 60);
            btn.style.cssText = `position:fixed; left:${x}px; top:${y}px; z-index:60; margin:0;`;
          };

          this.more = () => {
            FX.rain(5);
            let i = 0;
            clearInterval(fireworkTimer);
            fireworkTimer = setInterval(() => {
              FX.burst(innerWidth * (0.15 + Math.random() * 0.7),
                       innerHeight * (0.15 + Math.random() * 0.5));
              if (++i >= 5) clearInterval(fireworkTimer);
            }, 450);
          };

          this.replay = () => location.reload();

          this.toggleMusic = () => {
            if (songOn) { stopSong(); state.musicIcon = '🔇'; }
            else { playSong(); state.musicIcon = '🔊'; }
          };

          this.celebrate = (st) => {
            clearInterval(fireworkTimer);
            st.phase = 'celebrate';
            playSong();
            FX.rain(7);
            let i = 0;
            fireworkTimer = setInterval(() => {
              FX.burst(innerWidth * (0.15 + Math.random() * 0.7),
                       innerHeight * (0.2 + Math.random() * 0.45));
              if (++i >= 6) clearInterval(fireworkTimer);
            }, 500);
            setTimeout(() => FX.burst(innerWidth / 2, innerHeight * 0.35, 90), 250);
          };
        },

        stylesheet: {
          '.stage': `
            position: relative;
            z-index: 20;
            width: 100%;
            padding: 6vh 5%;
          `,
          '.wrap': `
            min-height: 88vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
          `,

          /* --- music toggle --- */
          '.music-btn': `
            position: fixed;
            top: 16px; right: 16px;
            z-index: 60;
            width: 46px; height: 46px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 215, 0, .08);
            border: 1px solid rgba(255, 215, 0, .55);
            color: #FFD700;
            font-size: 20px;
            cursor: pointer;
            transition: background .3s ease;
          `,
          '.music-btn:hover': `background: rgba(255, 215, 0, .22);`,

          /* --- ask slider (slides up into view) --- */
          '.slider': `
            opacity: 0;
            transform: translateY(45vh) scale(.8);
            transition: transform .9s cubic-bezier(.2,.9,.3,1.2), opacity .7s ease;
          `,
          '.slider.in': `
            opacity: 1;
            transform: translateY(0) scale(1);
          `,
          '.taunt': `
            color: #FFE44D;
            font-size: 1.05rem;
            margin-bottom: 1rem;
            min-height: 1.5em;
            font-style: italic;
            animation: fadeUp .4s ease both;
          `,
          '.ask-title': `
            font-family: 'Playfair Display', Georgia, serif;
            font-size: clamp(1.7rem, 5vw, 2.8rem);
            font-weight: 700;
            line-height: 1.3;
            margin-bottom: 2rem;
            background-image: linear-gradient(90deg, #FFD700, #FFF3B0, #B8860B, #FFD700);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: shimmer 3s linear infinite;
          `,

          /* --- buttons --- */
          '.btns': `
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
          `,
          '.btn': `
            padding: 15px 34px;
            border: none;
            border-radius: 50px;
            font-size: 1.05em;
            font-weight: 700;
            font-family: 'Manrope', serif;
            letter-spacing: .02em;
            cursor: pointer;
            transition: transform .2s ease, box-shadow .2s ease, background .2s ease;
          `,
          '.btn:active': `transform: scale(.95);`,
          '.gold': `
            background: linear-gradient(135deg, #FFD700, #FFAA00);
            color: #111;
            box-shadow: 0 0 28px rgba(255, 204, 0, .45);
          `,
          '.gold:hover': `
            transform: translateY(-3px) scale(1.04);
            box-shadow: 0 0 45px rgba(255, 204, 0, .7);
          `,
          '.ghost': `
            background: transparent;
            color: #FFCC00;
            border: 2px solid #FFCC00;
          `,
          '.ghost:hover': `background: rgba(255, 204, 0, .12);`,

          /* --- celebration (everything slides/pops in) --- */
          '.pre': `
            font-family: 'Manrope', sans-serif;
            font-weight: 600;
            color: #FFF3B0;
            letter-spacing: .35em;
            text-transform: uppercase;
            font-size: clamp(.6rem, 1.8vw, .85rem);
            margin-bottom: 1rem;
            animation: slideDown .7s ease both;
          `,
          '.hbd': `
            font-family: 'Playfair Display', Georgia, serif;
            font-size: clamp(2rem, 8vw, 5rem);
            font-weight: 800;
            letter-spacing: .12em;
            background-image: linear-gradient(90deg, #FFD700, #FFF3B0, #B8860B, #FFD700);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: shimmer 3s linear infinite, slideDown .7s .1s ease both;
          `,
          '@keyframes shimmer': `
            0% { background-position: 0% 50%; }
            100% { background-position: 300% 50%; }
          `,
          '@keyframes slideDown': `
            from { opacity: 0; transform: translateY(-34px); }
            to   { opacity: 1; transform: translateY(0); }
          `,
          '.name': `
            font-family: 'Great Vibes', cursive;
            font-size: clamp(4rem, 14vw, 9rem);
            font-weight: 400;
            line-height: 1.1;
            background-image: linear-gradient(90deg, #FFCC00, #FFE44D, #FFF9DB, #FFCC00);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: shimmer 3s linear infinite, pop .8s .25s cubic-bezier(.2,1.4,.4,1) both;
          `,
          '@keyframes pop': `
            0% { transform: scale(0) rotate(-6deg); opacity: 0; }
            100% { transform: scale(1) rotate(0); opacity: 1; }
          `,
          '.cake': `
            font-size: clamp(3.5rem, 10vw, 6rem);
            margin: .8rem 0 1.2rem;
            animation: cakeBounce 1.6s .9s ease-in-out infinite alternate;
            filter: drop-shadow(0 0 25px rgba(255, 204, 0, .4));
          `,
          '@keyframes cakeBounce': `
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-14px) scale(1.06); }
          `,
          '.wish-line': `
            font-family: 'Manrope', sans-serif;
            font-weight: 500;
            color: #f5e9c8;
            font-size: clamp(.95rem, 2.4vw, 1.2rem);
            margin: .25rem 0;
            opacity: 0;
            animation: fadeUp .8s ease forwards;
          `,
          '.w1': `animation-delay: .6s;`,
          '.w2': `animation-delay: 1.3s;`,
          '.w3': `animation-delay: 2s;`,
          '@keyframes fadeUp': `
            from { opacity: 0; transform: translateY(18px); }
            to   { opacity: 1; transform: translateY(0); }
          `,
          '.hint': `
            font-family: 'Manrope', sans-serif;
            margin: 1.4rem 0 1.6rem;
            color: #8a7f57;
            font-size: .85rem;
            letter-spacing: .08em;
            animation: fadeUp .8s 2.6s ease both;
          `
        }
      };
    }
    Component(Main);

    /* ============================================================
       ROOT
       ============================================================ */
    function Birthday() {
      return {
        mount: '#app',
        template: `<Main />`,
        stylesheet: {
          '*': `margin: 0; padding: 0; box-sizing: border-box;`,
          'html': `height: 100%;`,
          'body': `
            min-height: 100%;
            overflow-x: hidden;
            overflow-y: auto;
            background:
              radial-gradient(ellipse at 20% 10%, rgba(255, 204, 0, .07), transparent 55%),
              radial-gradient(ellipse at 80% 90%, rgba(255, 204, 0, .05), transparent 55%),
              #0a0a0a;
            font-family: 'Manrope', system-ui, sans-serif;
          `,
          '#app': `width: 100%;`
        }
      };
    }

    render(Component(Birthday));
  </script>
</body>
</html>
